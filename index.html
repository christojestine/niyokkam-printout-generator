<!DOCTYPE html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Niyokkam Printout Generator</title>
    <meta
      name="description"
      content="Generate Malayalam Karthika-font printouts from Unicode text. Add niyokkam items with dates and content, then export a Word document (.docx) ready for printing."
    />

    <!-- Favicon (inline SVG as data URI) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c3aed'/><path d='M8 10h16M8 16h12M8 22h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Malayalam font is self-hosted (src/font/files/*.woff2, declared in
      style.css) rather than loaded from Google Fonts or relied upon as an
      OS-installed font — this keeps rendering consistent on any device,
      region, or network condition, including mobile browsers/OSes that
      don't ship a Malayalam system font.
    -->
    <link rel="preload" as="font" type="font/woff2" href="./src/font/files/NotoSansMalayalam-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./src/font/files/NotoSansMalayalam-Bold.woff2" crossorigin />

    <!--
      Import map — pinned exact CDN versions so the deployed site never
      silently changes due to CDN "latest" resolution updates.

      Browser support:
        Chrome/Edge 89+, Firefox 108+, Safari 16.4+
    -->
    <script type="importmap">
      {
        "imports": {
          "react":            "https://esm.sh/react@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
          "docx":             "https://esm.sh/docx@9.0.0",
          "jspdf":            "https://esm.sh/jspdf@2.5.2",
          "html2canvas":      "https://esm.sh/html2canvas@1.4.1",
          "htm":              "https://esm.sh/htm@3.1.1",
          "htm/react":        "https://esm.sh/htm@3.1.1/react"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- App entry point (ES module; resolved via import map above) -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
